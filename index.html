<script>
(function () {

  function save() { try { localStorage.setItem(STORE_KEY, JSON.stringify(state)); } catch (e) {} }

  /* ---------- helpers ---------- */
  function el(tag, attrs, html) {
    const e = document.createElement(tag);
    if (attrs) for (const k in attrs) {
      if (k === "class") e.className = attrs[k];
      else if (k.startsWith("on")) e.addEventListener(k.slice(2), attrs[k]);
      else e.setAttribute(k, attrs[k]);
    }
    if (html != null) e.innerHTML = html;
    return e;
  }
  function shuffle(a) {
    const b = a.slice();
    for (let i = b.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [b[i], b[j]] = [b[j], b[i]]; }
    return b;
  }
  function shuffledIdx(n) {
    let idx = shuffle([...Array(n).keys()]);
    if (n > 2 && idx.every((v, i) => v === i)) idx = idx.reverse();
    return idx;
  }
  function norm(s) {
    return String(s).toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "")
      .replace(/[’‘`]/g, "'").replace(/izes?\b/g, m => m.replace("z", "s"))
      .replace(/[^a-z0-9' ]+/g, " ").replace(/\s+/g, " ").trim();
  }
  function lev(a, b) {
    const m = a.length, n = b.length, d = [];
    for (let i = 0; i <= m; i++) { d[i] = [i]; }
    for (let j = 0; j <= n; j++) d[0][j] = j;
    for (let i = 1; i <= m; i++) for (let j = 1; j <= n; j++)
      d[i][j] = Math.min(d[i - 1][j] + 1, d[i][j - 1] + 1, d[i - 1][j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
    return d[m][n];
  }

  function matchWord(given, accepted) {
    const g = norm(given);

  const R = {};

        const mid = j => { const r = cards[j].getBoundingClientRect(); return r.top + r.height / 2; };
        for (let k = order.indexOf(i); k > 0 && y < mid(order[k - 1]); k--) {
          const prev = order[k - 1]; list.insertBefore(cards[prev], card.nextSibling); [order[k - 1], order[k]] = [i, prev];
        }
        for (let k = order.indexOf(i); k < n - 1 && y > mid(order[k + 1]); k++) {
          const next = order[k + 1]; list.insertBefore(cards[next], card); [order[k], order[k + 1]] = [next, i];
        }
        renumber();
        card.style.transform = "none";
        const natural = card.getBoundingClientRect().top;
        card.style.transform = "translateY(" + (y - offset - natural) + "px)";
      }
      function onUp() {
        card.classList.remove("dragging"); card.style.transform = "";
        card.removeEventListener("pointermove", onMove);
        card.removeEventListener("pointerup", onUp);
        card.removeEventListener("pointercancel", onUp);
      }
      card.addEventListener("pointermove", onMove);
      card.addEventListener("pointerup", onUp);
      card.addEventListener("pointercancel", onUp);
    }
    render();
    return {
      getResp: () => order.slice(),
      setResp: r => { order = r.slice(); render(); },
      grade: r => { const ok = r.map((v, k) => v === k); return { pts: ok.filter(Boolean).length / n, ok }; },
      show: (r, g) => {
        order.forEach((i, k) => cards[i].classList.add(g.ok[k] ? "correct" : "wrong"));
        if (g.ok.includes(false)) {
          body.appendChild(el("div", { class: "statement", style: "margin-top:10px" },
            "<strong>Correct order:</strong><ol style='margin:6px 0 0 20px'>" + ex.items.map(t => "<li>" + t + "</li>").join("") + "</ol>"));
        }
      },
      lock: () => { locked = true; list.classList.add("locked"); }
    };
  };

  R.sort = function (ex, body) {
    const order = shuffledIdx(ex.items.length);
    const choice = Array(ex.items.length).fill(null);
    const rows = [];
    order.forEach(i => {
      const row = el("div", { class: "sort-item" });
      row.appendChild(el("div", { class: "txt" }, ex.items[i][0]));
      const bins = el("div", { class: "bins" });
      const btns = ex.bins.map((b, bi) => {
        const btn = el("button", { class: "pill", type: "button" }, b);
        btn.addEventListener("click", () => { if (btn.disabled) return; choice[i] = bi; btns.forEach(x => x.classList.toggle("on", x === btn)); });
        bins.appendChild(btn); return btn;
      });
      row.appendChild(bins); body.appendChild(row);
      rows[i] = { row, btns };
    });
    return {
      getResp: () => choice.includes(null) ? null : choice.slice(),
      setResp: r => r.forEach((bi, i) => { choice[i] = bi; rows[i].btns.forEach((b, k) => b.classList.toggle("on", k === bi)); }),
      grade: r => { const ok = r.map((bi, i) => bi === ex.items[i][1]); return { pts: ok.filter(Boolean).length / ok.length, ok }; },
      show: (r, g) => rows.forEach((x, i) => {
        x.row.classList.add(g.ok[i] ? "correct" : "wrong");
        x.btns.forEach((b, k) => { b.classList.remove("on"); if (k === ex.items[i][1]) b.classList.add("correct"); else if (k === r[i]) b.classList.add("wrong"); });
      }),
      lock: () => rows.forEach(x => x.btns.forEach(b => b.disabled = true))
    };
  };

  R.match = function (ex, body) {
    const rightOrder = shuffledIdx(ex.pairs.length);
    const rows = [];
    ex.pairs.forEach((pair, i) => {
      const row = el("div", { class: "match-row" });
      row.appendChild(el("div", { class: "left" }, ex.pairs[i][0]));
      const sel = el("select");
      sel.appendChild(el("option", { value: "" }, "— choose —"));
      rightOrder.forEach(j => sel.appendChild(el("option", { value: j }, ex.pairs[j][1])));
      row.appendChild(sel); body.appendChild(row);
      rows[i] = { row, sel };
    });
    return {
      getResp: () => { const v = rows.map(x => x.sel.value); return v.includes("") ? null : v.map(Number); },
      setResp: r => r.forEach((j, i) => rows[i].sel.value = j),
      grade: r => { const ok = r.map((j, i) => j === i); return { pts: ok.filter(Boolean).length / ok.length, ok }; },
      show: (r, g) => rows.forEach((x, i) => {
        x.row.classList.add(g.ok[i] ? "correct" : "wrong");
        if (!g.ok[i]) x.row.appendChild(el("div", { class: "fix", style: "grid-column:1/-1" }, "→ " + ex.pairs[i][1]));
      }),
      lock: () => rows.forEach(x => x.sel.disabled = true)
    };
  };

  /* ---------- scores ---------- */
  function lessonScore(n) {
    const L = LESSONS[n]; let pts = 0;
    L.exercises.forEach((ex, i) => { const s = state.ex[exKey(n, ex)]; if (s) pts += s.pts; });
    return { pts, max: L.exercises.length, done: L.exercises.filter((ex, i) => state.ex[exKey(n, ex)]).length };
  }
  function updateScores() {
    let pts = 0, max = 0;
    Object.keys(LESSONS).forEach(n => {
      const s = lessonScore(n); pts += s.pts; max += s.max;
      const tag = document.getElementById("ls-" + n);
      if (tag) tag.textContent = "Lesson score: " + fmt(s.pts) + " / " + s.max + "  (" + s.done + " / " + s.max + " done)";
    });
    document.getElementById("total-score").textContent = fmt(pts) + " / " + max;
    document.getElementById("total-score-2").textContent = fmt(pts) + " / " + max;
  }

  /* ---------- metacognition ---------- */
  function ratingBlock(n, which) {
    const L = LESSONS[n]; const box = el("div");
    L.objectives.forEach(o => {
      const row = el("div", { class: "obj" });
      row.appendChild(el("div", { class: "obj-text" }, o.text));
      const scale = el("div", { class: "scale" });
      const store = state[which][n] = state[which][n] || {};
      CONF.forEach((label, k) => {
        const b = el("button", { type: "button", class: store[o.id] === k + 1 ? "on" : "" }, label);
        b.addEventListener("click", () => {
          store[o.id] = k + 1; save();
          [...scale.children].forEach(x => x.classList.toggle("on", x === b));
        });
        scale.appendChild(b);
      });
      row.appendChild(scale); box.appendChild(row);
    });
    return box;
  }

  function reviewTable(n) {
    const L = LESSONS[n];
    const before = state.before[n] || {};
    const s = lessonScore(n);
    let html = "";
    if (s.done < s.max) html += "<p class='ex-help' style='margin-top:10px'>You have done " + s.done + " of " + s.max + " exercises. Your review is more useful when everything is done.</p>";
    L.objectives.forEach(o => {
      let p = 0, m = 0;
      L.exercises.forEach((ex, i) => { if (ex.obj !== o.id) return; const st = state.ex[exKey(n, ex)]; if (st) { p += st.pts; m += 1; } });
      const pct = m ? Math.round(100 * p / m) : null;
      const c = before[o.id];
      let tag, msg;
      if (pct == null) { tag = "<span class='tag mid'>—</span>"; msg = "No exercise done yet on this point."; }
      else {
        const cls = pct >= 80 ? "ok" : pct >= 50 ? "mid" : "ko";
        tag = "<span class='tag " + cls + "'>" + pct + " %</span>";
        if (!c) msg = pct >= 80 ? "Well done." : "Look at your mistakes and reread the key ideas.";
        else if (c >= 3 && pct < 50) msg = "<strong>Watch out:</strong> you felt sure, but your answers show gaps. Reread the key ideas, then try again.";
        else if (c >= 3 && pct < 80) msg = "You felt sure: you are nearly there. Check the corrections of your mistakes.";
        else if (c >= 3) msg = "You felt sure, and you were right. Well done!";
        else if (pct >= 80) msg = "<strong>Good news:</strong> you know more than you thought. Trust yourself!";
        else if (pct >= 50) msg = "You were careful, and you are getting there. Look at your mistakes.";
        else msg = "You were right to be careful: this point needs more work. Reread the key ideas and the glossary.";
      }
      html += "<div class='review-card'><div class='obj-text'>" + o.text + "</div>" +
        "<div class='review-line'>Before: <strong>" + (c ? CONF[c - 1] : "not rated") + "</strong> · My result: " + tag + "</div>" +
        "<div>" + msg + "</div></div>";
    });
    return html;
  }

  /* ---------- lesson panel ---------- */
  function buildLesson(meta, panel) {
    const n = meta.n, L = LESSONS[n];
    panel.style.setProperty("--lc", "var(--l" + n + ")");
    panel.appendChild(el("h2", null, "Lesson " + n + ": " + meta.title));
    panel.appendChild(el("p", { class: "question" }, meta.q));
    panel.appendChild(el("div", { class: "lesson-score", id: "ls-" + n }));

    function rebuild(focus) {
      panel.innerHTML = ""; buildLesson(meta, panel); updateScores();
      if (focus != null) panel.querySelectorAll(".exercise")[focus].scrollIntoView({ block: "center" });
    }
    function resetLesson() {
      if (!confirm("Erase all your answers for Lesson " + n + "?")) return;
      L.exercises.forEach((ex, i) => delete state.ex[exKey(n, ex)]);
      delete state.before[n]; delete state.after[n]; delete state.plan[n];
      save(); rebuild();
    }
    const topReset = el("button", { class: "reset-btn", type: "button", style: "margin:0 0 0 8px" }, "↺ Erase my answers");
    topReset.addEventListener("click", resetLesson);
    panel.appendChild(topReset);

    panel.appendChild(el("div", { class: "section-title" }, "① Before you start: how sure do you feel?"));
    const before = el("div", { class: "meta-box" });
    before.appendChild(el("p", { class: "intro" }, "Be honest: there is no wrong answer here. You will compare with your results at the end."));
    before.appendChild(ratingBlock(n, "before"));
    panel.appendChild(before);

    panel.appendChild(el("div", { class: "section-title" }, "② Exercises"));
    L.exercises.forEach((ex, i) => {
      const key = "l" + n + "e" + i, skey = exKey(n, ex);
      const box = el("div", { class: "exercise" });
      const head = el("div", { class: "ex-head" });
      head.appendChild(el("div", { class: "ex-q" }, (i + 1) + ". " + (ex.q || "True or false?")));
      head.appendChild(el("div", { class: "ex-type" }, TYPE_LABEL[ex.type]));
      box.appendChild(head);
      if (ex.img) {
        const fig = el("figure", { class: "ex-fig" });
        const a = el("a", { href: ex.img, target: "_blank", rel: "noopener" });
        a.appendChild(el("img", { src: ex.img, alt: ex.caption || "Diagram" }));
        fig.appendChild(a);
        fig.appendChild(el("figcaption", null, (ex.caption ? ex.caption + " " : "") + "Tap the image to enlarge it."));
        box.appendChild(fig);
      }
      const body = el("div"); box.appendChild(body);
      const api = R[ex.type](ex, body, key);
      const btn = el("button", { class: "check-btn", type: "button" }, "Check");
      const fb = el("div", { class: "feedback" });
      const retry = el("button", { class: "reset-btn", type: "button", style: "display:none; margin-top:10px" }, "↺ Try again");
      retry.addEventListener("click", () => { delete state.ex[skey]; save(); rebuild(i); });
      box.appendChild(btn); box.appendChild(fb); box.appendChild(retry);

      function reveal(resp) {
        const g = api.grade(resp);
        api.show(resp, g); api.lock(); btn.disabled = true; btn.textContent = "Done";
        retry.style.display = "inline-block";
        const full = g.pts >= 0.999, zero = g.pts <= 0.001;
        fb.className = "feedback show " + (full ? "ok" : zero ? "ko" : "mid");
        const parts = g.ok || (g.res && g.res.map(x => x > 0));
        const partial = parts ? parts.filter(Boolean).length + " of " + parts.length + " correct" : fmt(g.pts) + " / 1";
        let h = "<div class='verdict'>" + (full ? "✓ Correct!" : zero ? "✗ Not quite." : "◐ Partly right: " + partial) + "</div>";
        if (api.note && api.note(g)) h += "<div>" + api.note(g) + "</div>";
        if (ex.why) h += "<div>" + ex.why + "</div>";
        if (ex.mistake && !full) h += "<div class='mistake'>" + ex.mistake + "</div>";
        fb.innerHTML = h;
        return g;
      }
      btn.addEventListener("click", () => {
        const resp = api.getResp();
        if (resp == null) { fb.className = "feedback show warn"; fb.innerHTML = "Answer every part first."; return; }
        const g = reveal(resp);
        state.ex[skey] = { resp, pts: g.pts }; save(); updateScores();
      });
      const saved = state.ex[skey];
      if (saved) { try { api.setResp(saved.resp); reveal(saved.resp); } catch (e) { delete state.ex[skey]; } }
      panel.appendChild(box);
    });

    panel.appendChild(el("div", { class: "section-title" }, "③ After the exercises: my review"));
    const after = el("div", { class: "meta-box" });
    after.appendChild(el("p", { class: "intro" }, "Compare how sure you felt with your real results."));
    const out = el("div");
    const rb = el("button", { class: "check-btn", type: "button", style: "margin-top:0" }, "See my review");
    rb.addEventListener("click", () => { out.innerHTML = reviewTable(n); updatePlan.style.display = "block"; });
    after.appendChild(rb); after.appendChild(out);

    const updatePlan = el("div", { style: "display:none; margin-top:16px" });
    updatePlan.appendChild(el("p", { class: "obj-text" }, "Now, how sure do you feel?"));
    updatePlan.appendChild(ratingBlock(n, "after"));
    updatePlan.appendChild(el("p", { class: "obj-text", style: "margin-top:14px" }, "What will I do to revise this lesson? (choose one or more)"));
    const plans = ["Reread the key ideas", "Redo the exercises tomorrow", "Learn the glossary words", "Explain the lesson out loud to someone", "Ask my teacher a question"];
    const chips = el("div", { class: "scale" });
    const myPlan = state.plan[n] = state.plan[n] || [];
    plans.forEach((p, k) => {
      const c = el("button", { type: "button", class: "chip" + (myPlan.includes(k) ? " on" : "") }, p);
      c.addEventListener("click", () => {
        const at = myPlan.indexOf(k); if (at < 0) myPlan.push(k); else myPlan.splice(at, 1);
        c.classList.toggle("on"); save();
      });
      chips.appendChild(c);
    });
    updatePlan.appendChild(chips);
    after.appendChild(updatePlan);
    if (lessonScore(n).done) { out.innerHTML = reviewTable(n); updatePlan.style.display = "block"; }
    panel.appendChild(after);

    if (L.media && L.media.length) {
      panel.appendChild(el("div", { class: "section-title" }, "④ Watch, listen or read (optional)"));
      const ICON = { Video: "▶️", Podcast: "🎧", Read: "📄" };
      const list = el("div", { class: "media-list" });
      L.media.forEach(m => {
        const a = el("a", { class: "media-item", href: m.url, target: "_blank", rel: "noopener" });
        a.innerHTML = "<span class='ico'>" + (ICON[m.kind] || "🔗") + "</span><span><span class='kind'>" + m.kind +
          "</span><br><span class='ttl'>" + m.title + "</span> <span class='src'>(" + m.source + ")</span><br><span class='nt'>" + m.note + "</span></span>";
        list.appendChild(a);
      });
      panel.appendChild(list);
    }

    const key = el("details", { class: "key" });
    key.appendChild(el("summary", null, "Key ideas of Lesson " + n + " (take-home message)"));
    key.appendChild(el("ul", null, L.keyIdeas.map(k => "<li>" + k + "</li>").join("")));
    panel.appendChild(key);

    const reset = el("button", { class: "reset-btn", type: "button" }, "↺ Erase my answers and start this lesson again");
    reset.addEventListener("click", resetLesson);
    panel.appendChild(reset);
  }

  function buildLocked(meta, panel) {
    panel.style.setProperty("--lc", "var(--l" + meta.n + ")");
    panel.appendChild(el("div", { class: "locked-box" },
      "<div class='big'>🔒</div><h2>Lesson " + meta.n + ": " + meta.title + "</h2>" +
      "<p class='question'>" + meta.q + "</p>" +
      "<p>This review will open after we have done this lesson in class.</p>"));
  }

  function buildGlossary(panel) {
    panel.appendChild(el("h2", null, "Glossary: English → French"));
    panel.appendChild(el("p", { class: "question" }, "Key words of the open lessons. Type a word (in English or in French) to find it."));
    const search = el("input", { class: "gloss-search", type: "search", placeholder: "Search a word…" });
    panel.appendChild(search);
    const wrap = el("div", { class: "gloss" });
    LESSON_META.forEach(m => {
      const L = LESSONS[m.n]; if (!L) return;
      const sec = el("div");
      sec.appendChild(el("h3", null, "Lesson " + m.n + ": " + m.title));
      const t = el("table", { class: "gloss" });
      t.innerHTML = "<tr><th>English</th><th>Meaning</th><th>Français</th></tr>" +
        L.glossary.map(g => "<tr data-s=\"" + norm(g.join(" ")) + "\"><td>" + g[0] + "</td><td>" + g[1] + "</td><td>" + g[2] + "</td></tr>").join("");
      sec.appendChild(t); wrap.appendChild(sec);
    });
    panel.appendChild(wrap);
    search.addEventListener("input", () => {
      const q = norm(search.value);
      wrap.querySelectorAll("tr[data-s]").forEach(tr => tr.style.display = !q || tr.dataset.s.includes(q) ? "" : "none");
    });
  }

  /* ---------- tabs ---------- */
  const tabs = document.getElementById("tabs"), panels = document.getElementById("panels");
  const tabList = [];
  LESSON_META.forEach(m => {
    const open = !!LESSONS[m.n];
    const b = el("button", { class: "tab-btn" + (open ? "" : " locked"), type: "button", style: "background:var(--l" + m.n + ")" },
      (open ? "" : "🔒 ") + "Lesson " + m.n + "<small>" + m.short + "</small>");
    const p = el("section", { class: "panel" });
    if (open) buildLesson(m, p); else buildLocked(m, p);
    tabs.appendChild(b); panels.appendChild(p);
    tabList.push({ id: "L" + m.n, b, p });
  });
  const gb = el("button", { class: "tab-btn glossary", type: "button" }, "📖 Glossary<small>EN → FR</small>");
  const gp = el("section", { class: "panel" }); buildGlossary(gp);
  tabs.appendChild(gb); panels.appendChild(gp); tabList.push({ id: "G", b: gb, p: gp });

  function activate(id) {
    tabList.forEach(t => { const on = t.id === id; t.b.classList.toggle("active", on); t.p.classList.toggle("active", on); });
    state.tab = id; save();
  }
  tabList.forEach(t => t.b.addEventListener("click", () => activate(t.id)));
  const openIds = Object.keys(LESSONS).map(Number).sort((a, b) => a - b);
  const valid = tabList.some(t => t.id === state.tab) && (state.tab === "G" || LESSONS[state.tab.slice(1)]);
  activate(valid ? state.tab : "L" + openIds[0]);

  document.getElementById("subtitle").textContent = openIds.length === LESSON_META.length
    ? "Review of Lessons 1 to " + LESSON_META.length
    : "Review of Lessons 1 to " + openIds[openIds.length - 1] + " (more lessons coming soon)";
  document.getElementById("reset-all").addEventListener("click", () => {
    if (!confirm("Erase all your answers, in every lesson?")) return;
    try { localStorage.removeItem(STORE_KEY); } catch (e) {}
    location.reload();
  });
  updateScores();
})();
</script>
</body>
</html>
